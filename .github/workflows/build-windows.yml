name: Build Windows installer

on:
  push:
    branches:
      - claude/claude-md-documentation-hkqsah
    paths:
      - 'plc-field-assistant/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plc-field-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: plc-assistant-windows-installer
          path: plc-field-assistant/release/*.exe
          retention-days: 30
